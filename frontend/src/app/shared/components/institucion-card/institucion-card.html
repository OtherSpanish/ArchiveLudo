<!--
  Tarjeta de institución: ícono de edificio y nombre arriba, después
  tipo y país, cuántas copias custodia, contacto y un enlace a su ficha.
-->
<article class="tarjeta">

  <div class="encabezado">

    <!-- Ícono de edificio de 26 px en color de acento; es decorativo (aria-hidden) -->
    <svg class="icono-edificio" width="26" height="26" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="2" stroke-linecap="round"
         stroke-linejoin="round" aria-hidden="true">
      <path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z"></path>
      <path d="M6 12H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2"></path>
      <path d="M18 9h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2"></path>
      <path d="M10 6h4"></path>
      <path d="M10 10h4"></path>
      <path d="M10 14h4"></path>
      <path d="M10 18h4"></path>
    </svg>

    <h3 class="nombre">{{ institucion.nombre }}</h3>

  </div>

  <p class="tipo-pais">{{ tipoYPais }}</p>

  <p class="detalle">{{ textoCopias }}</p>

  <p class="detalle">{{ textoContacto }}</p>

  <!-- Es un enlace (<a>) porque lleva a otra pantalla: /instituciones/:id -->
  <a class="enlace" [routerLink]="['/instituciones', institucion.idInstitucion]">
    Ver ficha de la institución
  </a>

</article>
