<!--
  La barra solo se dibuja si hay sesión. "as actual" guarda la sesión en la
  variable "actual", que vale dentro de este bloque. Sin sesión (por ejemplo
  en /login), no se dibuja nada.
-->
@if (sesion; as actual) {

  <header class="barra">

    <a class="logo" routerLink="/" aria-label="ArchiveLudo, ir al inicio">
      <svg class="logo-icono" width="28" height="28" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round"
           stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="4" width="18" height="5" rx="1"></rect>
        <path d="M5 9v9a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V9"></path>
        <path d="M10 13h4"></path>
      </svg>
      <span class="logo-texto">ArchiveLudo</span>
    </a>

    <nav class="navegacion" aria-label="Navegación principal">
      @for (enlace of enlaces; track enlace.ruta) {
        <a class="enlace"
           [routerLink]="enlace.ruta"
           routerLinkActive="activo"
           [routerLinkActiveOptions]="{ exact: enlace.ruta === '/' }">
          {{ enlace.etiqueta }}
        </a>
      }
    </nav>

    <div class="derecha">

      <div class="buscador">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round"
             stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="7"></circle>
          <path d="M21 21l-4.3-4.3"></path>
        </svg>
        <input #campoBusqueda
               type="search"
               placeholder="Buscar videojuego"
               aria-label="Buscar videojuego"
               (keyup.enter)="buscar(campoBusqueda.value)">
      </div>

      <!-- Usuario con sesión: ícono, nombre, rol y botón para salir -->
      <div class="usuario">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
             stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="10"></circle>
          <circle cx="12" cy="10" r="3"></circle>
          <path d="M6.2 18.5c1.4-2.3 3.4-3.5 5.8-3.5s4.4 1.2 5.8 3.5"></path>
        </svg>

        <span class="usuario-datos">
          <span class="usuario-nombre">{{ actual.nombreUsuario }}</span>
          <span class="usuario-rol">Rol: {{ textoRol }}</span>
        </span>

        <button type="button" class="boton-salir" (click)="cerrarSesion()">
          Cerrar sesión
        </button>
      </div>

    </div>
  </header>

}
